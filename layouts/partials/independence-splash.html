<div id="independence-splash" class="id-splash-overlay" aria-hidden="true" style="display: none;">
  <!-- Inline guard script to run as fast as possible -->
  <script>
    (function() {
      try {
        if (!sessionStorage.getItem('india_80th_splash_seen')) {
          var splash = document.getElementById('independence-splash');
          if (splash) {
            splash.style.display = 'flex';
            splash.removeAttribute('aria-hidden');
          }
        }
      } catch(e) {}
    })();
  </script>

  <style>
    .id-splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999999;
      background: radial-gradient(circle at 50% 20%, rgba(255, 153, 51, 0.22) 0%, transparent 55%),
                  radial-gradient(circle at 50% 80%, rgba(19, 136, 8, 0.22) 0%, transparent 55%),
                  #070a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      padding: 1.5rem 1rem;
    }

    .id-splash-overlay.id-splash-hiding {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ambient background tricolor glows */
    .id-splash-glow-top {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(300px, 80vw, 650px);
      height: 380px;
      background: radial-gradient(circle, rgba(255, 153, 51, 0.38) 0%, rgba(255, 153, 51, 0) 70%);
      filter: blur(55px);
      pointer-events: none;
    }

    .id-splash-glow-bottom {
      position: absolute;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(300px, 80vw, 650px);
      height: 380px;
      background: radial-gradient(circle, rgba(19, 136, 8, 0.38) 0%, rgba(19, 136, 8, 0) 70%);
      filter: blur(55px);
      pointer-events: none;
    }

    /* Confetti Canvas */
    #id-splash-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Content Wrapper */
    .id-splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 620px;
      width: 100%;
      margin: auto;
      animation: idSplashPopIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes idSplashPopIn {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Top Emblem / Chakra Container */
    .id-chakra-container {
      position: relative;
      width: clamp(80px, 20vw, 110px);
      height: clamp(80px, 20vw, 110px);
      margin-bottom: clamp(1rem, 3vh, 1.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .id-chakra-halo {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #FF9933, #FFFFFF, #138808, #FF9933);
      filter: blur(12px);
      opacity: 0.65;
      animation: idHaloSpin 12s linear infinite;
    }

    @keyframes idHaloSpin {
      100% { transform: rotate(360deg); }
    }

    .id-chakra-svg {
      position: relative;
      width: 100%;
      height: 100%;
      animation: idChakraSpin 20s linear infinite;
      filter: drop-shadow(0 0 12px rgba(0, 0, 128, 0.7));
    }

    @keyframes idChakraSpin {
      100% { transform: rotate(360deg); }
    }

    /* 80th Badge */
    .id-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: clamp(0.75rem, 2.5vw, 0.85rem);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #f1f5f9;
      margin-bottom: clamp(0.8rem, 2.5vh, 1.25rem);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .id-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FF9933;
      box-shadow: 0 0 8px #FF9933;
    }

    /* Main Headline */
    .id-title-main {
      font-size: clamp(1.6rem, 6.5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 0.75rem 0;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .id-subtitle {
      font-size: clamp(0.85rem, 3vw, 1.15rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
      margin: 0 0 clamp(1.2rem, 3vh, 2rem) 0;
      line-height: 1.5;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      padding: 0 0.5rem;
    }

    /* Progress bar and skip section */
    .id-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
      max-width: 280px;
    }

    .id-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .id-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808);
      border-radius: 4px;
      transition: width 0.05s linear;
    }

    .id-skip-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: manipulation;
    }

    .id-skip-btn:hover, .id-skip-btn:focus {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .id-skip-btn:active {
      transform: translateY(0);
    }

    .id-skip-btn svg {
      width: 15px;
      height: 15px;
      transition: transform 0.25s ease;
    }

    .id-skip-btn:hover svg {
      transform: translateX(3px);
    }

    @media (max-height: 600px) {
      .id-splash-overlay {
        justify-content: flex-start;
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      .id-chakra-container {
        width: 65px;
        height: 65px;
        margin-bottom: 0.75rem;
      }
      .id-title-main {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .id-subtitle {
        margin-bottom: 1rem;
      }
    }
  </style>

  <!-- Script for interactivity, auto-fade timer (3s), and confetti particle canvas -->
  <script>
    (function() {
      var splashElem = document.getElementById('independence-splash');
      if (!splashElem) return;

      // Check if already displayed in this session
      try {
        if (sessionStorage.getItem('india_80th_splash_seen')) {
          splashElem.style.display = 'none';
          return;
        }
      } catch(e) {}

      // Mark as seen in sessionStorage
      try {
        sessionStorage.setItem('india_80th_splash_seen', 'true');
      } catch(e) {}

      // Reveal splash
      splashElem.style.display = 'flex';

      var DURATION = 3000; // 3 seconds
      var startTime = Date.now();
      var progressFill = document.getElementById('id-progress-fill');
      var skipBtn = document.getElementById('id-skip-btn');
      var timerId = null;

      function dismissSplash() {
        if (timerId) clearInterval(timerId);
        splashElem.classList.add('id-splash-hiding');
        setTimeout(function() {
          splashElem.style.display = 'none';
        }, 650);
      }

      if (skipBtn) {
        skipBtn.addEventListener('click', dismissSplash);
      }

      // Update progress bar smooth animation
      timerId = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var pct = Math.min(100, (elapsed / DURATION) * 100);
        if (progressFill) {
          progressFill.style.width = pct + '%';
        }
        if (elapsed >= DURATION) {
          dismissSplash();
        }
      }, 30);

      /* Tricolor Confetti / Floating Particles Canvas */
      var canvas = document.getElementById('id-splash-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var width = canvas.width = window.innerWidth;
      var height = canvas.height = window.innerHeight;

      var handleResize = function() {
        if (!canvas) return;
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', handleResize);

      var colors = ['#FF9933', '#FFFFFF', '#138808', '#FFD700'];
      var particles = [];
      var particleCount = Math.min(70, Math.floor(width / 18));

      for (var i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 4 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 1.5,
          vy: -Math.random() * 1.8 - 0.8,
          alpha: Math.random() * 0.7 + 0.3,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05
        });
      }

      var animFrameId;
      function renderParticles() {
        if (splashElem.classList.contains('id-splash-hiding') || splashElem.style.display === 'none') {
          if (animFrameId) cancelAnimationFrame(animFrameId);
          return;
        }

        ctx.clearRect(0, 0, width, height);

        for (var j = 0; j < particles.length; j++) {
          var p = particles[j];
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;

          // Wrap particles
          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;

          // Alternate between circles and small confetti rectangles
          if (j % 2 === 0) {
            ctx.beginPath();
            ctx.arc(0, 0, p.r, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.r, -p.r * 1.5, p.r * 2, p.r * 3);
          }

          ctx.restore();
        }

        animFrameId = requestAnimationFrame(renderParticles);
      }

      renderParticles();
    })();
  </script>
</div>
