{{ $front := .Get "front" | default "Front" }}
{{ $back := .Get "back" | default "Back" }}
<div style="border: 1px solid var(--border); padding: 0.75rem; margin: 1rem 0;">
  <div><strong>[Flashcard - Question]</strong></div>
  <div>{{ $front | markdownify }}</div>
  <details style="margin-top: 0.5rem;">
    <summary style="cursor: pointer; color: var(--link);">[Reveal Answer]</summary>
    <div style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed var(--border);">
      {{ $back | markdownify }}
    </div>
  </details>
</div>
