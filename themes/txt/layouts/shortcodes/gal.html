{{ $items := .Inner | transform.Unmarshal }}
<div class="thought-gallery">
  {{ range $items }}
    {{ $src := .src }}
    {{ if and $src (ne $src "") }}
      {{ $path := strings.TrimPrefix "/" $src }}
      {{ $url := $src }}
      {{ with resources.Get $path }}{{ $url = .RelPermalink }}{{ end }}
      <a href="{{ $url }}" target="_blank">
        <img src="{{ $url }}" alt="{{ .alt | default "Image" }}" loading="lazy" decoding="async" style="max-width: 200px; max-height: 150px; object-fit: cover;">
      </a>
    {{ end }}
  {{ end }}
</div>
