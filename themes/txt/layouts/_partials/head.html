<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ site.Title }}</title>
{{ with .Description | default site.Params.tagline }}
<meta name="description" content="{{ . }}">
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AlternativeOutputFormats -}}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safeURL }}">
{{ end -}}
<style>
:root {
  --bg: #ffffff;
  --fg: #000000;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --border: #cccccc;
  --dim: #555555;
  --code-bg: #eeeeee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --link: #66b2ff;
    --visited: #da99ff;
    --active: #ff6666;
    --border: #444444;
    --dim: #aaaaaa;
    --code-bg: #1c1c1c;
  }
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.site-layout {
  display: flex;
  gap: 2.5rem;
  max-width: 1040px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
}
.site-sidebar {
  width: 220px;
  flex-shrink: 0;
}
.sidebar-sticky {
  position: sticky;
  top: 1.5rem;
}
.site-content {
  flex: 1;
  min-width: 0;
}
.site-main {
  min-height: 60vh;
}
a { color: var(--link); text-decoration: underline; }
a:visited { color: var(--visited); }
a:active { color: var(--active); }
h1, h2, h3, h4, h5, h6 { font-weight: 700; line-height: 1.25; margin: 1.75rem 0 0.5rem; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p, ul, ol, dl, table, pre, blockquote { margin: 0 0 1rem; }
hr { border: 0; border-top: 1px solid var(--border); margin: 1.25rem 0; }
pre, code, kbd, samp {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: var(--code-bg);
}
pre { padding: 0.75rem 1rem; overflow-x: auto; border: 1px solid var(--border); }
code { padding: 0.15em 0.3em; }
pre code { background: none; padding: 0; }
blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--border); color: var(--dim); }
img { max-width: 100%; height: auto; display: block; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.95em; }
th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
th { background: var(--code-bg); }
.nav-menu { list-style: none; padding: 0; margin: 0.75rem 0; }
.nav-menu li { margin-bottom: 0.35rem; }
.nav-menu li a { font-weight: 600; text-decoration: underline; }
.nav-menu li a.active { font-weight: 700; }
.meta { color: var(--dim); font-size: 0.9em; }
.meta a { color: inherit; text-decoration: underline; }
.meta a:hover { color: var(--link); }
.tag { font-size: 0.85em; color: var(--dim); }
.pagination { display: flex; justify-content: space-between; margin: 1.5rem 0; font-size: 0.9em; }
.feed-item, .list-item { margin-bottom: 1.25rem; }
.thought-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.thought-gallery img { max-width: 140px; max-height: 140px; object-fit: cover; }

/* Blog */
ul.blog-posts { list-style: none; padding: 0; margin: 0.75rem 0 1.5rem; }
ul.blog-posts li { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; line-height: 1.45; }
ul.blog-posts li time { flex: 0 0 65px; color: var(--dim); font-size: 0.9em; font-variant-numeric: tabular-nums; }
ul.blog-posts li a { font-weight: 500; }

/* Gallery Grid */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin: 1.25rem 0 2rem;
}
.gallery-item {
  border: 1px solid var(--border);
  padding: 0.5rem;
  background: var(--code-bg);
  display: flex;
  flex-direction: column;
}
.gallery-thumb-link {
  display: block;
  overflow: hidden;
  aspect-ratio: 4/3;
  border: 1px solid var(--border);
  background: var(--bg);
}
.gallery-thumb-link img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border: none;
}
.gallery-item-meta {
  margin-top: 0.5rem;
  line-height: 1.35;
  font-size: 0.85em;
}

/* Photo details / EXIF */
.exif-table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9em;
}
.exif-table th {
  width: 140px;
  background: var(--code-bg);
  font-weight: 600;
}

/* Action buttons */
.btn-action {
  display: inline-block;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--border);
  background: var(--code-bg);
  color: var(--fg);
  cursor: pointer;
  font-size: 0.9em;
  border-radius: 2px;
  font-family: inherit;
}
.btn-action:hover {
  background: var(--border);
}

.sidebar-extra-mobile {
  display: none;
}

/* Mobile responsive styles */
@media (max-width: 768px) {
  .sidebar-extra-desktop {
    display: none;
  }
  .sidebar-extra-mobile {
    display: block;
    margin-top: 0.5rem;
  }
  .site-layout {
    flex-direction: column;
    gap: 1.25rem;
    padding: 1rem 0.75rem;
  }
  .site-sidebar {
    width: 100%;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
  }
  .site-sidebar hr {
    display: none;
  }
  .sidebar-brand {
    margin-bottom: 0.5rem;
  }
  .sidebar-sticky {
    position: static;
  }
  .nav-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.5rem 0;
    padding: 0;
  }
  .nav-menu li {
    margin-bottom: 0;
  }
  .nav-menu li a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.35rem 0.65rem;
    border: 1px solid var(--border);
    text-decoration: none;
    font-size: 0.9em;
    border-radius: 2px;
    background: var(--code-bg);
    color: var(--fg);
    min-height: 36px;
  }
  .nav-menu li a.active,
  .nav-menu li a:active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    font-weight: bold;
  }
  details.sidebar-extra-mobile summary {
    display: block;
    cursor: pointer;
    padding: 0.4rem 0;
    font-size: 0.9em;
    font-weight: 600;
    color: var(--dim);
  }
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
  }
  .gallery-item {
    padding: 0.35rem;
  }
  ul.blog-posts li {
    gap: 0.6rem;
  }
  ul.blog-posts li time {
    flex: 0 0 55px;
    font-size: 0.85em;
  }
}
</style>
