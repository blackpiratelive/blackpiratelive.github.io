<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ site.Title }}</title>
{{ with .Description | default site.Params.tagline }}
<meta name="description" content="{{ . }}">
{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AlternativeOutputFormats -}}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safeURL }}">
{{ end -}}
<style>
:root {
  --bg: #ffffff;
  --fg: #000000;
  --link: #0000ee;
  --visited: #551a8b;
  --active: #ff0000;
  --border: #cccccc;
  --dim: #555555;
  --code-bg: #eeeeee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --link: #66b2ff;
    --visited: #da99ff;
    --active: #ff6666;
    --border: #444444;
    --dim: #aaaaaa;
    --code-bg: #1c1c1c;
  }
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
}
.site-layout {
  display: flex;
  gap: 2.5rem;
  max-width: 1040px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
}
.site-sidebar {
  width: 220px;
  flex-shrink: 0;
}
.sidebar-sticky {
  position: sticky;
  top: 1.5rem;
}
.site-content {
  flex: 1;
  min-width: 0;
}
.site-main {
  min-height: 60vh;
}
a { color: var(--link); text-decoration: underline; }
a:visited { color: var(--visited); }
a:active { color: var(--active); }
h1, h2, h3, h4, h5, h6 { font-weight: 700; line-height: 1.25; margin: 1.75rem 0 0.5rem; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1.05rem; }
p, ul, ol, dl, table, pre, blockquote { margin: 0 0 1rem; }
hr { border: 0; border-top: 1px solid var(--border); margin: 1.25rem 0; }
pre, code, kbd, samp {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: var(--code-bg);
}
pre { padding: 0.75rem 1rem; overflow-x: auto; border: 1px solid var(--border); }
code { padding: 0.15em 0.3em; }
pre code { background: none; padding: 0; }
blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--border); color: var(--dim); }
img { max-width: 100%; height: auto; display: block; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.95em; }
th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
th { background: var(--code-bg); }
.nav-menu { list-style: none; padding: 0; margin: 0.75rem 0; }
.nav-menu li { margin-bottom: 0.35rem; }
.nav-menu li a { font-weight: 600; text-decoration: underline; }
.nav-menu li a.active { font-weight: 700; }
.meta { color: var(--dim); font-size: 0.9em; }
.meta a { color: inherit; text-decoration: underline; }
.meta a:hover { color: var(--link); }
.tag { font-size: 0.85em; color: var(--dim); }
.pagination { display: flex; justify-content: space-between; margin: 1.5rem 0; font-size: 0.9em; }
.feed-item, .list-item { margin-bottom: 1.25rem; }
.thought-gallery { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.thought-gallery img { max-width: 140px; max-height: 140px; object-fit: cover; }

/* Blog */
ul.blog-posts { list-style: none; padding: 0; margin: 0.75rem 0 1.5rem; }
ul.blog-posts li { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; line-height: 1.45; }
ul.blog-posts li time { flex: 0 0 65px; color: var(--dim); font-size: 0.9em; font-variant-numeric: tabular-nums; }
ul.blog-posts li a { font-weight: 500; }

/* Gallery Grid */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin: 1.25rem 0 2rem;
}
.gallery-item {
  border: 1px solid var(--border);
  padding: 0.5rem;
  background: var(--code-bg);
  display: flex;
  flex-direction: column;
}
.gallery-thumb-link {
  display: block;
  overflow: hidden;
  aspect-ratio: 4/3;
  border: 1px solid var(--border);
  background: var(--bg);
}
.gallery-thumb-link img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border: none;
}
.gallery-item-meta {
  margin-top: 0.5rem;
  line-height: 1.35;
  font-size: 0.85em;
}

/* Photo details / EXIF */
.exif-table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9em;
}
.exif-table th {
  width: 140px;
  background: var(--code-bg);
  font-weight: 600;
}

/* Action buttons */
.btn-action {
  display: inline-block;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--border);
  background: var(--code-bg);
  color: var(--fg);
  cursor: pointer;
  font-size: 0.9em;
  border-radius: 2px;
  font-family: inherit;
}
.btn-action:hover {
  background: var(--border);
}

.sidebar-extra-mobile {
  display: none;
}

/* Mobile responsive styles */
@media (max-width: 768px) {
  .sidebar-extra-desktop {
    display: none;
  }
  .sidebar-extra-mobile {
    display: block;
    margin-top: 0.5rem;
  }
  .site-layout {
    flex-direction: column;
    gap: 1.25rem;
    padding: 1rem 0.75rem;
  }
  .site-sidebar {
    width: 100%;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
  }
  .site-sidebar hr {
    display: none;
  }
  .sidebar-brand {
    margin-bottom: 0.5rem;
  }
  .sidebar-sticky {
    position: static;
  }
  .nav-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.5rem 0;
    padding: 0;
  }
  .nav-menu li {
    margin-bottom: 0;
  }
  .nav-menu li a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.35rem 0.65rem;
    border: 1px solid var(--border);
    text-decoration: none;
    font-size: 0.9em;
    border-radius: 2px;
    background: var(--code-bg);
    color: var(--fg);
    min-height: 36px;
  }
  .nav-menu li a.active,
  .nav-menu li a:active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    font-weight: bold;
  }
  details.sidebar-extra-mobile summary {
    display: block;
    cursor: pointer;
    padding: 0.4rem 0;
    font-size: 0.9em;
    font-weight: 600;
    color: var(--dim);
  }
  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
  }
  .gallery-item {
    padding: 0.35rem;
  }
  ul.blog-posts li {
    gap: 0.6rem;
  }
  ul.blog-posts li time {
    flex: 0 0 55px;
    font-size: 0.85em;
  }
}

/* Homepage hero */
.site-hero {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  min-height: 520px;
  margin: 0 0 2.25rem;
  border: 1px solid #262626;
  border-radius: 18px;
  overflow: hidden;
  background: #111111;
  color: #f5f5f5;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.14);
}
.site-hero-media {
  position: relative;
  min-height: 100%;
  overflow: hidden;
  background: #0b0b0b;
}
.site-hero-media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  border: 0;
  border-radius: 0;
  animation: hero-image-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.site-hero-media::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(17, 17, 17, 0) 52%, rgba(17, 17, 17, 0.35) 78%, rgba(17, 17, 17, 0.94) 100%),
    linear-gradient(180deg, rgba(17, 17, 17, 0.12) 0%, rgba(17, 17, 17, 0) 16%, rgba(17, 17, 17, 0) 84%, rgba(17, 17, 17, 0.16) 100%);
}
.site-hero-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 2.25rem;
  background:
    radial-gradient(circle at 92% 4%, rgba(255, 107, 0, 0.12), rgba(255, 107, 0, 0) 42%),
    #111111;
}
.site-hero-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0 0 0.9rem;
  color: #ff7a1a;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  line-height: 1.2;
  text-transform: uppercase;
}
.site-hero-eyebrow svg {
  flex: 0 0 auto;
  fill: currentColor;
}
.site-hero-title {
  margin: 0 0 0.85rem;
  color: #ffffff;
  font-size: clamp(2.6rem, 4.6vw, 3.35rem);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.98;
  text-wrap: balance;
}
.site-hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin: 0 0 0.95rem;
}
.site-hero-badges span {
  display: inline-flex;
  align-items: center;
  padding: 0.22rem 0.62rem;
  border: 1px solid rgba(255, 138, 61, 0.38);
  border-radius: 999px;
  background: rgba(255, 107, 0, 0.07);
  color: #e9a267;
  font-size: 0.63rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  line-height: 1.4;
  text-transform: uppercase;
  white-space: nowrap;
}
.site-hero-desc {
  max-width: 30ch;
  margin: 0 0 1.15rem;
  color: #b8b8b8;
  font-size: 0.93rem;
  line-height: 1.55;
}
.site-hero-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0 0 0.9rem;
}
.site-hero-stat {
  display: flex;
  flex-direction: column;
  margin: 0;
}
.site-hero-stat dd {
  order: 1;
  margin: 0;
  color: #ffffff;
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.site-hero-stat dt {
  order: 2;
  margin-top: 0.25rem;
  color: #8a8a8a;
  font-size: 0.61rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  line-height: 1.2;
  text-transform: uppercase;
}
.site-hero-meta {
  margin: 0 0 1.15rem;
  color: #7f7f7f;
  font-size: 0.74rem;
  line-height: 1.45;
}
.site-hero-meta .dot {
  margin: 0 0.35rem;
  color: #4a4a4a;
}
.site-hero-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 0.5rem;
}
.site-hero-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 42px;
  padding: 0.62rem 0.9rem;
  border: 1px solid transparent;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.site-hero-btn svg {
  flex: 0 0 auto;
}
.site-hero-btn-primary {
  border-color: #ff6b00;
  background: #ff6b00;
  color: #ffffff;
}
.site-hero-btn-primary:visited {
  color: #ffffff;
}
.site-hero-btn-primary:hover {
  border-color: #ff8124;
  background: #ff8124;
  color: #ffffff;
}
.site-hero-btn-ghost {
  border-color: #3a3a3a;
  background: rgba(255, 255, 255, 0.02);
  color: #f2f2f2;
}
.site-hero-btn-ghost:visited {
  color: #f2f2f2;
}
.site-hero-btn-ghost:hover {
  border-color: #555555;
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}
.site-hero-btn-icon {
  flex: 0 0 auto;
  width: 42px;
  padding: 0;
  border-color: #3a3a3a;
  background: rgba(255, 255, 255, 0.02);
  color: #f2f2f2;
}
.site-hero-btn-icon:hover {
  border-color: #555555;
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}
.site-hero-btn-icon.is-copied {
  border-color: #ff6b00;
  background: #ff6b00;
  color: #ffffff;
}
.site-hero-btn:focus-visible {
  outline: 2px solid #ff9445;
  outline-offset: 2px;
}
.site-hero-panel > * {
  animation: hero-copy-in 550ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.site-hero-panel > :nth-child(1) { animation-delay: 60ms; }
.site-hero-panel > :nth-child(2) { animation-delay: 120ms; }
.site-hero-panel > :nth-child(3) { animation-delay: 180ms; }
.site-hero-panel > :nth-child(4) { animation-delay: 240ms; }
.site-hero-panel > :nth-child(5) { animation-delay: 300ms; }
.site-hero-panel > :nth-child(6) { animation-delay: 360ms; }
.site-hero-panel > :nth-child(7) { animation-delay: 420ms; }
@keyframes hero-image-in {
  from {
    opacity: 0;
    transform: scale(1.04);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes hero-copy-in {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .site-hero-media img,
  .site-hero-panel > * {
    animation: none;
  }
}

@media (max-width: 980px) {
  .site-hero {
    grid-template-columns: 1fr;
    min-height: 0;
  }
  .site-hero-media {
    height: clamp(320px, 48vw, 420px);
  }
  .site-hero-media img {
    object-position: 50% 22%;
  }
  .site-hero-media::after {
    background:
      linear-gradient(180deg, rgba(17, 17, 17, 0.12) 0%, rgba(17, 17, 17, 0) 18%),
      linear-gradient(180deg, rgba(17, 17, 17, 0) 50%, rgba(17, 17, 17, 0.94) 100%);
  }
  .site-hero-panel {
    padding: 2rem;
  }
}

@media (max-width: 480px) {
  .site-hero {
    border-radius: 14px;
  }
  .site-hero-media {
    height: 300px;
  }
  .site-hero-panel {
    padding: 1.5rem;
  }
  .site-hero-title {
    font-size: 2.4rem;
  }
  .site-hero-desc {
    max-width: none;
  }
}
</style>
