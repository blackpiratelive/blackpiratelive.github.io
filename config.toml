baseURL = 'https://blackpiratex.com'
defaultContentLanguage = 'en-us'
locale = 'en-us'
title = 'BlackPirateX'
theme = 'typography-minimal'

[params]
  author = "Sudip"
  tagline = "Homepage of Sudip Mandal"
  github = "https://github.com/blackpiratelive"
  cinetracker_api_url = "https://movie-trackerh.vercel.app/api/v1/export"
  tmdb_api_key = "61c9bbbefe48beed3b4f02f0cc4794e7"
  cms_api_url = "https://admin.blackpiratex.com"

[taxonomies]
  tag = "tags"
  album = "albums"

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 20

  [[menus.main]]
    name = 'Thoughts'
    pageRef = '/thoughts'
    weight = 30

  [[menus.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 40

  [[menus.main]]
    name = 'Media'
    pageRef = '/media'
    weight = 45

  [[menus.main]]
    name = 'Links'
    pageRef = '/links'
    weight = 50

[outputs]
  home = ["HTML", "RSS", "ATOM", "JSON"]
  section = ["HTML", "RSS", "ATOM", "JSON"]
  taxonomy = ["HTML", "RSS", "ATOM"]
  term = ["HTML", "RSS", "ATOM"]

[mediaTypes]
  [mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.ATOM]
    mediaType = "application/atom+xml"
    baseName = "atom"
    isPlainText = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      footnote = true

[security]
  enableInlineShortcodes = false
  allowContent = ['^text/html$', '^text/markdown$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^VERCEL$', '^TURSO_', '^CMS_', '^CINETRACKER_', '^CINEMA_']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['(?i)^https?://[a-z0-9]', '(?i)localhost']
